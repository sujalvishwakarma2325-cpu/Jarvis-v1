name: Build JARVIS V3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract JARVIS project
        run: |
          unzip -o JARVIS_V1_Project.zip -d jarvis

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare all JARVIS V3 folders
        run: |
          mkdir -p jarvis/app/src/main/java/com/jarvis/v1
          mkdir -p jarvis/app/src/main/java/com/jarvis/v3/ui
          mkdir -p jarvis/app/src/main/java/com/jarvis/v3/voice
          mkdir -p jarvis/app/src/main/java/com/jarvis/v3/ai

      - name: Copy JARVIS V3 MainActivity
        run: |
          cp JARVIS_V3/JARVIS_V3/MainActivity.kt \
            jarvis/app/src/main/java/com/jarvis/v1/MainActivity.kt

      - name: Copy JARVIS V3 UI
        run: |
          cp JARVIS_V3/JARVIS_V3/ui/JarvisTheme.kt \
            jarvis/app/src/main/java/com/jarvis/v3/ui/JarvisTheme.kt

          cp JARVIS_V3/JARVIS_V3/ui/JarvisOrbView.kt \
            jarvis/app/src/main/java/com/jarvis/v3/ui/JarvisOrbView.kt

          cp JARVIS_V3/JARVIS_V3/ui/JarvisUI.kt \
            jarvis/app/src/main/java/com/jarvis/v3/ui/JarvisUI.kt

      - name: Copy JARVIS V3 Voice files
        run: |
          cp JARVIS_V3/JARVIS_V3/voice/VoiceInput.kt \
            jarvis/app/src/main/java/com/jarvis/v3/voice/VoiceInput.kt

          cp JARVIS_V3/JARVIS_V3/voice/VoiceOutput.kt \
            jarvis/app/src/main/java/com/jarvis/v3/voice/VoiceOutput.kt

      - name: Copy JARVIS V3 Gemini AI
        run: |
          cp JARVIS_V3/JARVIS_V3/ai/GeminiAI.kt \
            jarvis/app/src/main/java/com/jarvis/v3/ai/GeminiAI.kt

      - name: Verify required V3 files
        run: |
          echo "===== V3 FILE CHECK ====="

          test -f JARVIS_V3/JARVIS_V3/MainActivity.kt
          test -f JARVIS_V3/JARVIS_V3/voice/VoiceInput.kt
          test -f JARVIS_V3/JARVIS_V3/voice/VoiceOutput.kt
          test -f JARVIS_V3/JARVIS_V3/ai/GeminiAI.kt

          echo "All source files found."

          echo ""
          echo "===== COPIED VOICE FILES ====="
          ls -la jarvis/app/src/main/java/com/jarvis/v3/voice/

      - name: Clean Kotlin source files
        working-directory: jarvis
        run: |
          find app/src/main/java -name "*.kt" -type f -print0 | while IFS= read -r -d '' file; do
            sed -i '1s/^\xEF\xBB\xBF//' "$file"
          done

      - name: Add required permissions
        working-directory: jarvis
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")

          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found")

          s = p.read_text()

          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
          ]

          for permission in permissions:
              if permission.strip() not in s:
                  s = s.replace(
                      "</manifest>",
                      permission + "\n</manifest>"
                  )

          p.write_text(s)
          PY

      - name: Configure BuildConfig and dependencies
        working-directory: jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "buildConfig = true" not in s:
              s += '''

          android {
              buildFeatures {
                  buildConfig = true
              }

              defaultConfig {
                  buildConfigField(
                      "String",
                      "GEMINI_API_KEY",
                      "\\"${System.getenv("GEMINI_API_KEY") ?: ""}\\""
                  )
              }
          }
          '''

          if "kotlinx-coroutines-android" not in s:
              s += '''

          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          '''

          p.write_text(s)
          PY

      - name: Configure Java and Kotlin 17
        working-directory: jarvis
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "jvmToolchain(17)" not in s:
              s += '''

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          '''

          p.write_text(s)
          PY

      - name: Verify copied source files
        working-directory: jarvis
        run: |
          echo "===== MainActivity ====="
          sed -n '1,230p' \
            app/src/main/java/com/jarvis/v1/MainActivity.kt

          echo ""
          echo "===== VoiceInput ====="
          sed -n '1,260p' \
            app/src/main/java/com/jarvis/v3/voice/VoiceInput.kt

          echo ""
          echo "===== VoiceOutput ====="
          sed -n '1,220p' \
            app/src/main/java/com/jarvis/v3/voice/VoiceOutput.kt

          echo ""
          echo "===== GeminiAI ====="
          sed -n '1,320p' \
            app/src/main/java/com/jarvis/v3/ai/GeminiAI.kt

      - name: Build JARVIS V3 APK
        working-directory: jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload JARVIS V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V3-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
