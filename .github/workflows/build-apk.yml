name: Build JARVIS V3 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Extract original Android project
      - name: Extract JARVIS project
        run: |
          unzip -o JARVIS_V1_Project.zip -d jarvis

      # 3. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # 5. Prepare JARVIS V3 folders
      - name: Prepare JARVIS V3 folders
        run: |
          mkdir -p jarvis/app/src/main/java/com/jarvis/v1
          mkdir -p jarvis/app/src/main/java/com/jarvis/v3/ui
          mkdir -p jarvis/app/src/main/java/com/jarvis/v3/voice

      # 6. Copy MainActivity
      - name: Copy JARVIS V3 MainActivity
        run: |
          cp JARVIS_V3/JARVIS_V3/MainActivity.kt \
            jarvis/app/src/main/java/com/jarvis/v1/MainActivity.kt

      # 7. Copy V3 UI files
      - name: Copy JARVIS V3 UI
        run: |
          cp JARVIS_V3/JARVIS_V3/ui/JarvisTheme.kt \
            jarvis/app/src/main/java/com/jarvis/v3/ui/JarvisTheme.kt

          cp JARVIS_V3/JARVIS_V3/ui/JarvisOrbView.kt \
            jarvis/app/src/main/java/com/jarvis/v3/ui/JarvisOrbView.kt

          cp JARVIS_V3/JARVIS_V3/ui/JarvisUI.kt \
            jarvis/app/src/main/java/com/jarvis/v3/ui/JarvisUI.kt

      # 8. Copy Voice Input
      - name: Copy JARVIS V3 Voice Input
        run: |
          cp JARVIS_V3/JARVIS_V3/voice/VoiceInput.kt \
            jarvis/app/src/main/java/com/jarvis/v3/voice/VoiceInput.kt

      # 9. Clean Kotlin source files
      - name: Clean Kotlin source files
        working-directory: jarvis
        run: |
          find app/src/main/java -name "*.kt" -type f -print0 | while IFS= read -r -d '' file; do
            sed -i '1s/^\xEF\xBB\xBF//' "$file"
          done

      # 10. Add required permissions
      - name: Add required permissions
        working-directory: jarvis
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/AndroidManifest.xml")

          if p.exists():
              s = p.read_text()

              permissions = [
                  '    <uses-permission android:name="android.permission.INTERNET" />',
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />'
              ]

              for permission in permissions:
                  if permission.strip() not in s:
                      s = s.replace(
                          "</manifest>",
                          permission + "\n</manifest>"
                      )

              p.write_text(s)
          PY

      # 11. Configure BuildConfig and Gemini
      - name: Configure BuildConfig and dependencies
        working-directory: jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "buildConfig = true" not in s:
              s += '''

          android {
              buildFeatures {
                  buildConfig = true
              }

              defaultConfig {
                  buildConfigField(
                      "String",
                      "GEMINI_API_KEY",
                      "\\"${System.getenv("GEMINI_API_KEY") ?: ""}\\""
                  )
              }
          }
          '''

          if "kotlinx-coroutines-android" not in s:
              s += '''

          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
          }
          '''

          p.write_text(s)
          PY

      # 12. Configure Java/Kotlin 17
      - name: Configure Java 17
        working-directory: jarvis
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "jvmToolchain(17)" not in s:
              s += '''

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          '''

          p.write_text(s)
          PY

      # 13. Verify V3 files
      - name: Verify JARVIS V3 files
        run: |
          echo "===== MainActivity ====="
          sed -n '1,100p' \
            jarvis/app/src/main/java/com/jarvis/v1/MainActivity.kt

          echo ""
          echo "===== JarvisTheme ====="
          sed -n '1,100p' \
            jarvis/app/src/main/java/com/jarvis/v3/ui/JarvisTheme.kt

          echo ""
          echo "===== JarvisOrbView ====="
          sed -n '1,100p' \
            jarvis/app/src/main/java/com/jarvis/v3/ui/JarvisOrbView.kt

          echo ""
          echo "===== JarvisUI ====="
          sed -n '1,120p' \
            jarvis/app/src/main/java/com/jarvis/v3/ui/JarvisUI.kt

          echo ""
          echo "===== VoiceInput ====="
          sed -n '1,180p' \
            jarvis/app/src/main/java/com/jarvis/v3/voice/VoiceInput.kt

      # 14. Build APK
      - name: Build JARVIS V3 APK
        working-directory: jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          gradle assembleDebug --no-daemon

      # 15. Upload APK
      - name: Upload JARVIS V3 APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V3-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
