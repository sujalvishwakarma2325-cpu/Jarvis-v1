name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract JARVIS project
        run: |
          unzip -o JARVIS_V1_Project.zip -d jarvis

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Add Internet permission
        working-directory: jarvis
        run: |
          python3 -c "from pathlib import Path; p=Path('app/src/main/AndroidManifest.xml'); s=p.read_text(); s=s.replace('</manifest>', '    <uses-permission android:name=\"android.permission.INTERNET\" />\n</manifest>') if 'android.permission.INTERNET' not in s else s; p.write_text(s)"

      - name: Fix Java Kotlin JVM target
        working-directory: jarvis
        run: |
          python3 -c "from pathlib import Path; p=Path('app/build.gradle.kts'); s=p.read_text(); s += '\nandroid { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\nkotlin { jvmToolchain(17) }\n' if 'jvmToolchain(17)' not in s else ''; p.write_text(s)"

      - name: Build APK
        working-directory: jarvis
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V1-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
