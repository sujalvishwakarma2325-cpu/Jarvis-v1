name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract JARVIS project
        run: |
          unzip -o JARVIS_V1_Project.zip -d jarvis
          cd jarvis
          find . -maxdepth 2 -type f | head -50

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Fix Java Kotlin JVM target
        working-directory: jarvis
        run: |
          FILE="$(find . -path '*/app/build.gradle.kts' -type f | head -1)"
          echo "Using Gradle file: $FILE"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          s += '''

          // CI Java/Kotlin 17 fix
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          '''

          p.write_text(s)
          print("JVM target fixed:", p)

      - name: Build APK
        working-directory: jarvis
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-V1-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
