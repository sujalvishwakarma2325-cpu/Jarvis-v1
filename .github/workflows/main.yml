name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Extract JARVIS
        run: unzip -o JARVIS_V1_Project.zip -d jarvis

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure project
        working-directory: jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -c "from pathlib import Path; p=Path('app/src/main/AndroidManifest.xml'); s=p.read_text(); s=s.replace('</manifest>','    <uses-permission android:name=\"android.permission.INTERNET\" />\n</manifest>') if 'android.permission.INTERNET' not in s else s; p.write_text(s)"

          python3 -c "from pathlib import Path; p=Path('app/build.gradle.kts'); s=p.read_text(); s += '\nandroid { compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\nkotlin { jvmToolchain(17) }\n' if 'jvmToolchain(17)' not in s else ''; p.write_text(s)"

          python3 -c "from pathlib import Path; import os; p=Path('app/src/main/java/com/jarvis/v1/MainActivity.kt'); s=p.read_text(); s=s.replace('private const val GEMINI_API_KEY = \"\"','private const val GEMINI_API_KEY = \"'+os.environ['GEMINI_API_KEY']+'\"'); p.write_text(s)"

      - name: Build APK
        working-directory: jarvis
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-GEMINI-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
