name: Inspect JARVIS Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract JARVIS project
        run: |
          unzip -o JARVIS_V1_Project.zip -d jarvis

      - name: Show MainActivity code
        run: |
          echo "===== MAIN ACTIVITY CODE START ====="
          cat jarvis/app/src/main/java/com/jarvis/v1/MainActivity.kt
          echo "===== MAIN ACTIVITY CODE END ====="
