name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract JARVIS project
        run: |
          unzip -o JARVIS_V1_Project.zip -d jarvis

      - name: Add Gemini API key
        working-directory: jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/com/jarvis/v1/MainActivity.kt")
          s = p.read_text()

          marker = 'class MainActivity : ComponentActivity(), TextToSpeech.OnInitListener {'

          s = s.replace(
              marker,
              'private const val GEMINI_API_KEY = "' + '${{ secrets.GEMINI_API_KEY }}' + '"\n\n' + marker
          )

          p.write_text(s)
          PY

      - name: Fix Java Kotlin JVM target
        working-directory: jarvis
        run: |
          FILE="app/build.gradle.kts"

          cat >> "$FILE" <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          kotlin {
              jvmToolchain(17)
          }
          EOF

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: jarvis
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-GEMINI-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
