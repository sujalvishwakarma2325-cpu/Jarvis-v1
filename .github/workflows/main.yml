name: Build JARVIS APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract JARVIS project
        run: |
          unzip -o JARVIS_V1_Project.zip -d jarvis

      - name: Install Gemini and Phone Control
        working-directory: jarvis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          kotlin_code = r'''package com.jarvis.v1

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.BatteryManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.activity.ComponentActivity
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale

          private const val GEMINI_API_KEY = "__GEMINI_API_KEY__"

          class MainActivity : ComponentActivity(),
              TextToSpeech.OnInitListener {

              private lateinit var status: TextView
              private lateinit var response: TextView
              private lateinit var talkButton: Button
              private lateinit var tts: TextToSpeech

              private var speechRecognizer: SpeechRecognizer? = null
              private var continuousMode = false
              private var isListening = false

              private val history =
                  mutableListOf<Pair<String, String>>()

              private val permissionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.RequestPermission()
                  ) { granted ->
                      if (granted) {
                          startConversation()
                      } else {
                          status.text = "MICROPHONE PERMISSION REQUIRED"
                      }
                  }

              private val recognitionListener =
                  object : RecognitionListener {

                      override fun onReadyForSpeech(params: Bundle?) {
                          isListening = true
                          status.text = "LISTENING..."
                      }

                      override fun onBeginningOfSpeech() {
                          status.text = "HEARING YOU..."
                      }

                      override fun onRmsChanged(rmsdB: Float) {}

                      override fun onBufferReceived(buffer: ByteArray?) {}

                      override fun onEndOfSpeech() {
                          isListening = false
                          status.text = "THINKING..."
                      }

                      override fun onError(error: Int) {
                          isListening = false

                          if (continuousMode) {
                              Handler(Looper.getMainLooper()).postDelayed({
                                  if (continuousMode) {
                                      startListening()
                                  }
                              }, 700)
                          } else {
                              status.text = "READY"
                          }
                      }

                      override fun onResults(results: Bundle?) {
                          isListening = false

                          val text =
                              results
                                  ?.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION
                                  )
                                  ?.firstOrNull()

                          if (!text.isNullOrBlank()) {
                              handleCommand(text)
                          } else if (continuousMode) {
                              startListening()
                          }
                      }

                      override fun onPartialResults(partialResults: Bundle?) {}

                      override fun onEvent(
                          eventType: Int,
                          params: Bundle?
                      ) {}
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  tts = TextToSpeech(this, this)

                  setupSpeechRecognizer()
                  setupUI()
              }

              private fun setupUI() {

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL

                      setPadding(
                          40,
                          60,
                          40,
                          40
                      )

                      setBackgroundColor(
                          android.graphics.Color.rgb(5, 7, 13)
                      )
                  }

                  val title = TextView(this).apply {
                      text = "J A R V I S"
                      textSize = 32f

                      setTextColor(
                          android.graphics.Color.rgb(
                              93,
                              231,
                              255
                          )
                      )
                  }

                  status = TextView(this).apply {
                      text = "ONLINE • GEMINI CORE"
                      textSize = 14f

                      setTextColor(
                          android.graphics.Color.rgb(
                              139,
                              166,
                              184
                          )
                      )

                      setPadding(
                          0,
                          16,
                          0,
                          24
                      )
                  }

                  response = TextView(this).apply {
                      text =
                          "Hello. I am JARVIS. How can I help you?"

                      textSize = 20f

                      setTextColor(
                          android.graphics.Color.rgb(
                              232,
                              247,
                              255
                          )
                      )

                      setPadding(
                          0,
                          30,
                          0,
                          30
                      )
                  }

                  talkButton = Button(this).apply {
                      text = "🎙 START CONVERSATION"
                      textSize = 18f

                      setOnClickListener {

                          if (continuousMode) {
                              stopConversation()
                          } else {

                              if (
                                  ContextCompat.checkSelfPermission(
                                      this@MainActivity,
                                      Manifest.permission.RECORD_AUDIO
                                  ) ==
                                  PackageManager.PERMISSION_GRANTED
                              ) {
                                  startConversation()
                              } else {
                                  permissionLauncher.launch(
                                      Manifest.permission.RECORD_AUDIO
                                  )
                              }
                          }
                      }
                  }

                  val clearButton = Button(this).apply {
                      text = "CLEAR MEMORY"

                      setOnClickListener {
                          history.clear()

                          response.text =
                              "Conversation memory cleared."

                          speak(
                              "Conversation memory cleared."
                          )
                      }
                  }

                  val batteryButton = Button(this).apply {
                      text = "CHECK BATTERY"

                      setOnClickListener {
                          val reply = batteryReply()

                          response.text = reply
                          speak(reply)
                      }
                  }

                  root.addView(title)
                  root.addView(status)
                  root.addView(response)
                  root.addView(talkButton)
                  root.addView(clearButton)
                  root.addView(batteryButton)

                  setContentView(root)
              }

              private fun setupSpeechRecognizer() {

                  if (
                      !SpeechRecognizer
                          .isRecognitionAvailable(this)
                  ) {
                      return
                  }

                  speechRecognizer =
                      SpeechRecognizer
                          .createSpeechRecognizer(this)

                  speechRecognizer
                      ?.setRecognitionListener(
                          recognitionListener
                      )
              }

              private fun startConversation() {

                  continuousMode = true

                  talkButton.text =
                      "⏹ STOP CONVERSATION"

                  status.text =
                      "CONVERSATION MODE ON"

                  startListening()
              }

              private fun stopConversation() {

                  continuousMode = false
                  isListening = false

                  speechRecognizer?.cancel()
                  tts.stop()

                  talkButton.text =
                      "🎙 START CONVERSATION"

                  status.text = "READY"

                  response.text =
                      "Conversation stopped."
              }

              private fun startListening() {

                  if (!continuousMode) return
                  if (isListening) return

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) != PackageManager.PERMISSION_GRANTED
                  ) {
                      permissionLauncher.launch(
                          Manifest.permission.RECORD_AUDIO
                      )
                      return
                  }

                  val intent =
                      Intent(
                          RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                      ).apply {

                          putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                          )

                          putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE,
                              "en-IN"
                          )

                          putExtra(
                              RecognizerIntent.EXTRA_MAX_RESULTS,
                              1
                          )

                          putExtra(
                              RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                              false
                          )
                      }

                  speechRecognizer?.startListening(intent)
              }

              private fun handleCommand(command: String) {

                  response.text = "You: $command"
                  status.text = "PROCESSING..."

                  val lower =
                      command.lowercase(Locale.getDefault())

                  if (handlePhoneCommand(lower)) {
                      return
                  }

                  if ("battery" in lower) {

                      val reply = batteryReply()

                      addHistory(command, reply)

                      response.text = reply
                      speak(reply)

                      return
                  }

                  Thread {

                      try {

                          val reply = askGemini(command)

                          runOnUiThread {

                              response.text = reply
                              status.text = "JARVIS ONLINE"

                              speak(reply)
                          }

                      } catch (e: Exception) {

                          runOnUiThread {

                              val error =
                                  "Sorry, I could not connect to Gemini."

                              response.text = error
                              status.text =
                                  "AI CONNECTION ERROR"

                              speak(error)
                          }
                      }

                  }.start()
              }

              private fun handlePhoneCommand(
                  command: String
              ): Boolean {

                  when {

                      command.contains("youtube") -> {
                          openAppByName("YouTube")
                          return true
                      }

                      command.contains("whatsapp") -> {
                          openAppByName("WhatsApp")
                          return true
                      }

                      command.contains("chrome") -> {
                          openAppByName("Chrome")
                          return true
                      }

                      command.contains("calculator") ||
                      command.contains("calc") -> {
                          openCalculator()
                          return true
                      }

                      command.contains("settings") ||
                      command.contains("setting") -> {
                          openSettings()
                          return true
                      }

                      command.contains("phone") ||
                      command.contains("dialer") -> {
                          openPhone()
                          return true
                      }
                  }

                  return false
              }

              private fun openAppByName(appName: String) {

                  val launcherIntent =
                      Intent(Intent.ACTION_MAIN).apply {
                          addCategory(Intent.CATEGORY_LAUNCHER)
                      }

                  val apps =
                      packageManager.queryIntentActivities(
                          launcherIntent,
                          PackageManager.MATCH_ALL
                      )

                  val target =
                      apps.firstOrNull { info ->

                          info.loadLabel(packageManager)
                              .toString()
                              .trim()
                              .equals(
                                  appName,
                                  ignoreCase = true
                              )
                      }

                  if (target == null) {

                      val reply =
                          "$appName is not available on this phone."

                      response.text = reply
                      speak(reply)

                      return
                  }

                  try {

                      val intent =
                          packageManager
                              .getLaunchIntentForPackage(
                                  target.activityInfo.packageName
                              )

                      if (intent == null) {
                          throw Exception("No launch intent")
                      }

                      startActivity(intent)

                      val reply =
                          "Opening $appName."

                      response.text = reply
                      speak(reply)

                  } catch (e: Exception) {

                      val reply =
                          "I could not open $appName."

                      response.text = reply
                      speak(reply)
                  }
              }

              private fun openCalculator() {

                  try {

                      val intent =
                          Intent(Intent.ACTION_MAIN)

                      intent.addCategory(
                          Intent.CATEGORY_APP_CALCULATOR
                      )

                      startActivity(intent)

                      val reply =
                          "Opening calculator."

                      response.text = reply
                      speak(reply)

                  } catch (e: Exception) {

                      val reply =
                          "Calculator is not available."

                      response.text = reply
                      speak(reply)
                  }
              }

              private fun openSettings() {

                  try {

                      startActivity(
                          Intent(Settings.ACTION_SETTINGS)
                      )

                      val reply =
                          "Opening settings."

                      response.text = reply
                      speak(reply)

                  } catch (e: Exception) {

                      speak(
                          "I could not open settings."
                      )
                  }
              }

              private fun openPhone() {

                  try {

                      startActivity(
                          Intent(Intent.ACTION_DIAL)
                      )

                      val reply =
                          "Opening phone."

                      response.text = reply
                      speak(reply)

                  } catch (e: Exception) {

                      speak(
                          "I could not open the phone."
                      )
                  }
              }

              private fun addHistory(
                  user: String,
                  model: String
              ) {

                  synchronized(history) {

                      history.add(
                          Pair("user", user)
                      )

                      history.add(
                          Pair("model", model)
                      )

                      while (history.size > 20) {
                          history.removeAt(0)
                      }
                  }
              }

              private fun askGemini(
                  command: String
              ): String {

                  val url =
                      URL(
                          "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.7-flash:generateContent"
                      )

                  val connection =
                      url.openConnection()
                          as HttpURLConnection

                  connection.requestMethod = "POST"

                  connection.setRequestProperty(
                      "Content-Type",
                      "application/json"
  
